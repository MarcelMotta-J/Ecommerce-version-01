<h2>⭐ Reviews</h2>

<table class="table table-striped">
  <thead>
    <tr>
      <th>id</th>
      <th>Produto</th>
      <th>Usuário</th>
      <th>Nota</th>
      <th>Comentário</th>
      <th>Data</th>
      <th>Ação</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let r of reviews">

      <td>{{ r.id }}</td>

      <td>{{ r.productName }}</td>

      <td>{{ r.userEmail }}</td>

      <!-- ⭐ estrelas -->
      <td>
        <span *ngFor="let star of [1,2,3,4,5]">
          <i class="fa"
             [ngClass]="star <= r.rating ? 'fa-star' : 'fa-star-o'">
          </i>
        </span>
      </td>

      <td>{{ r.comment }}</td>

      <!-- 📅 data -->
      <td>{{ r.createdAt | date:'dd/MM/yyyy HH:mm' }}</td>

      <td>
        <button class="btn btn-danger btn-sm" (click)="delete(r.id)">
          🗑️
        </button>
      </td>

    </tr>
  </tbody>
</table>
